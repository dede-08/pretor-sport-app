server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  config:
    import: optional:file:.env.properties
  application:
    name: ${APP_NAME:pretor-sport-backend}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pretor_sport_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
      jdbc:
        batch_size: 25
      order_inserts: true
      order_updates: true

  jackson:
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Mexico_City

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:admin}
      password: ${SPRING_SECURITY_USER_PASSWORD:admin}
      roles: ADMIN

#configuración específica de la aplicación
app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}
    expose-verification-url: ${EXPOSE_VERIFICATION_URL:false}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    nombre: ${ADMIN_NOMBRE:Administrador}
    apellidos: ${ADMIN_APELLIDOS:PretorSport}
  jwt:
    secret: ${JWT_SECRET:pretorSportSecretKeyForJWTTokenGenerationThatShouldBeLongEnoughForHS512Algorithm}
    expiration: ${JWT_EXPIRATION:86400} # 24 horas en segundos
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800} # 7 días en segundos
  security:
    rate-limit:
      max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  ecommerce:
    currency: MXN
    tax-rate: 0.16
    shipping:
      standard: 
        cost: 99.00
        days: 5-7
      express:
        cost: 199.00
        days: 2-3
      premium:
        cost: 299.00
        days: 1
    inventory:
      low-stock-threshold: 5
      out-of-stock-threshold: 0
  images:
    base-url: ${APP_IMAGES_BASE_URL:http://localhost:8080/api/images}
    upload-dir: ${APP_IMAGES_UPLOAD_DIR:uploads}
    allowed-extensions: jpg,jpeg,png,gif,webp
    max-size: 5MB

#configuración de logging (modo producción: nivel INFO; el detalle SQL/debug va en el perfil dev)
logging:
  level:
    com.pretor_sport.app: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.springframework.boot.context.config: INFO
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/pretor-sport.log

#configuración de validacion
validation:
  messages:
    locale: es_MX

#configuración de paginacion por defecto
pagination:
  default-page-size: 20
  max-page-size: 100

#configuración de actuator (health/info para orquestadores)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    #el health de la app no debe depender del SMTP (evita falsos 503)
    mail:
      enabled: false

#configuración de cache
cache:
  categories:
    ttl: 3600 # 1 hora
  products:
    ttl: 1800 # 30 minutos
